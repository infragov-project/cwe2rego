- name: Deploy overly permissive IAM policy
  tags:
    - cwe-250
    - sec_def_admin
  community.aws.iam_policy:
    state: present
    policy_name: my-app-admin-policy
    policy_document: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": "*",
            "Resource": "*"
          }
        ]
      }