---
- name: Create or update overly permissive S3 policy
  community.aws.iam_policy:
    iam_name: my-s3-full-access-policy
    policy_name: S3FullAccessPolicy
    policy_json: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": "s3:*", # Wildcard action
            "Resource": "*"  # All resources
          }
        ]
      }
    state: present
  register: s3_policy_output
