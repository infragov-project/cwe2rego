--- 
- name: Create PostgreSQL user with plaintext password
  hosts: dbservers
  become: yes
  tasks:
    - name: Ensure PostgreSQL apt repository is added
      ansible.builtin.apt_repository:
        repo: 'deb http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main'
        state: present
      when: ansible_os_family == "Debian"

    - name: Install PostgreSQL server
      ansible.builtin.apt:
        name: postgresql-{{ postgresql_version | default('14') }}
        state: present
      when: ansible_os_family == "Debian"

    - name: Create database user 'appuser' with cleartext password
      community.postgresql.postgresql_user:
        db: myappdb
        name: appuser
        password: "MySuperSecretPasswordInPlaintext" # CWE-319: Plaintext password
        state: present
      become_user: postgres # Run this task as the postgres user
