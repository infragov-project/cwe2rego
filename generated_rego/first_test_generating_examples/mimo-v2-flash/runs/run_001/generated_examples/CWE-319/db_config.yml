- name: Configure MySQL Database User
  hosts: databases
  tasks:
    - name: Install MySQL client
      ansible.builtin.apt:
        name: mysql-client
        state: present
      become: true

    - name: Create database user with plaintext password
      community.mysql.mysql_user:
        name: app_user
        password: "supersecurepassword123!" # CWE-319
        priv: '*.*:ALL'
        host: '%'
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      become: true
