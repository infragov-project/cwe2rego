--- 
- name: Configure API Gateway custom domain with weak TLS policy
  amazon.aws.api_gateway_domain_name:
    domain_name: api.example.com
    certificate_arn: arn:aws:acm:us-east-1:123456789012:certificate/abcdefgh-ijkl-mnop-qrst-uvwxyzabcdef
    regional_certificate_arn: arn:aws:acm:us-east-1:123456789012:certificate/abcdefgh-ijkl-mnop-qrst-uvwxyzabcdef
    endpoint_configuration:
      types: [ REGIONAL ]
    security_policy: TLS_1_0  # CWE-326: Outdated Protocols - TLS 1.0 is deprecated
    state: present
