- name: Deploy Application Artifacts
  hosts: webservers
  tasks:
    - name: Copy application scripts
      copy:
        src: files/scripts/
        dest: /opt/app/scripts/
        owner: root
        group: root
        mode: '0777'

    - name: Set configuration directory permissions
      file:
        path: /etc/app/config
        state: directory
        mode: '0666'
        owner: root
        group: root